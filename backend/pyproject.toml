[project]
name = "e-procurement-backend"
version = "0.1.0"
description = "E-Procurement platform backend API"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "flask-cors>=5.0",
    "flask-jwt-extended>=4.7",
    "flask-babel>=4.0",
    "flask-sqlalchemy>=3.1,<4",
    "flask-migrate>=4,<5",
    "psycopg2-binary>=2.9,<3",
    "requests>=2.31,<3",
    "pdfplumber>=0.11,<1",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "email-validator>=2.2",
    "gunicorn>=23.0",
    "bcrypt>=4.2",
    "flask-limiter[redis]>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
